<script>

    function DistrictList(ID, ToBind, SelectedVal) {
        $("#loader").show();
        var DivID = $("#" + ID).val(); InnerDistrict(DivID, ToBind, SelectedVal);
        $("#Taluka").empty();
        $("#Taluka").append($('<option></option>').val("").html("Select Taluka"));
        $("#Village").empty();
        $("#Village").append($('<option></option>').val("").html("Select Village"));
        $("#loader").hide();

    }
    function InnerDistrict(DivID, ToBind, SelectedVal) {

        $.ajax
       ({
           url: '/SearchList/GetDistrict',
           type: 'POST',
           datatype: 'application/json',
           contentType: 'application/json',
           data: JSON.stringify({
               DivID: +DivID
           }),
           success: function (result) {


               $("#" + ToBind).html("");
               $("#" + ToBind).append
                   ($('<option></option>').val('').html('Select District'))
               $.each(result, function (i, Dis) {
                   if (SelectedVal == Dis.ID) {
                       $("#" + ToBind).append
                             ($("<option selected='selected'></option>").val(Dis.ID).html(Dis.Text))
                   }
                   else {
                       $("#" + ToBind).append($('<option></option>').val(Dis.ID).html(Dis.Text))
                   }
               })
           },
           error: function () {

           },
       });

    }
    function TalukaList(ID, ToBind) {

        $("#loader").show();
        var DisID = $("#" + ID).val();
        InnerTaluka(DisID, ToBind, '0');
        $("#Village").empty();
        $("#Village").append($('<option></option>').val("").html("Select Village"));
        $("#loader").hide();

    }
    function InnerTaluka(DisID, ToBind, SelectedVal) {
        $.ajax
       ({
           url: '/SearchList/GetTaluka',
           type: 'POST',
           datatype: 'application/json',
           contentType: 'application/json',
           data: JSON.stringify({
               DisID: +DisID
           }),
           success: function (result) {
               $("#" + ToBind).html("");
               $("#" + ToBind).append
                   ($('<option></option>').val('').html('Select Taluka'))
               $.each(result, function (i, Taluka) {
                   if (SelectedVal == Taluka.ID) {
                       $("#" + ToBind).append
                             ($("<option selected='selected'></option>").val(Taluka.ID).html(Taluka.Text))
                   }
                   else {
                       $("#" + ToBind).append
                       ($('<option></option>').val(Taluka.ID).html(Taluka.Text))
                   }
               })
           },
           error: function () {

           },
       });
    }
    function refreshCaptcha() {
        document.getElementById("captchaImage").src = '/SearchList/SearchCaptcha' + '?' + new Date().getTime();
    }
    function VillageList(ID, ToBind) {

        $("#loader").show();
        var TalukaID = $("#" + ID).val();
        InnerVillage(TalukaID, ToBind, '0');
        $("#loader").hide();

    }

    function InnerVillage(TalukaID, ToBind, SelectedVal) {

        $.ajax
       ({
           url: '/SearchList/GetVillage',
           type: 'POST',
           datatype: 'application/json',
           contentType: 'application/json',
           data: JSON.stringify({
               TalukaID: +TalukaID
           }),
           success: function (result) {
               $("#" + ToBind).html("");
               $("#" + ToBind).append
                   ($('<option></option>').val('').html('Select Village'))
               $.each(result, function (i, Village) {

                   if (SelectedVal == Village.ID) {
                       $("#" + ToBind).append
                             ($("<option selected='selected'></option>").val(Village.ID).html(Village.Text))
                   }
                   else {
                       $("#" + ToBind).append
                          ($('<option></option>').val(Village.ID).html(Village.Text))
                   }
               })
           },
           error: function () {

           },
       });
    }
